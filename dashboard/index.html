      .amorce {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F4F5FA;
      }

      .amorce-marque {
        position: relative;
        display: block;
        height: 104px;
        aspect-ratio: 144 / 256;
        background: var(--amorce-glyphe) center / contain no-repeat;
        -webkit-mask: var(--amorce-glyphe) center / contain no-repeat;
                mask: var(--amorce-glyphe) center / contain no-repeat;
        animation: amorce-souffle 2s ease-in-out infinite;
      }

      /* La lumière s'arrête aux bords du glyphe : c'est le masque du parent
         qui la découpe. Sans lui elle balaierait un rectangle lumineux. */
      .amorce-marque::after {
        content: "";
        position: absolute;
        left: 0;
        top: -20%;
        width: 56%;
        height: 140%;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(255, 255, 255, 0.52) 38%,
          transparent 72%
        );
        filter: blur(7px);
        animation: amorce-balayage 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      @media (min-width: 640px) { .amorce-marque { height: 124px } }

      @keyframes amorce-souffle { 0%, 100% { opacity: 0.78 } 50% { opacity: 1 } }
      @keyframes amorce-balayage {
        0% { transform: translateX(-140%) }
        100% { transform: translateX(210%) }
      }

      @media (prefers-reduced-motion: reduce) {
        .amorce-marque { animation: none; opacity: 0.9 }
        .amorce-marque::after { animation: none; opacity: 0 }
      }
    </style>
  </head>
  <body>
    <!-- React vide #root à sa première image : l'amorce s'efface d'elle-même,
         exactement quand l'application s'affiche. -->
    <div id="root">
      <div class="amorce"><span class="amorce-marque"></span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
